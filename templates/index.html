<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Home Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='16') }}">
</head>
<body>
  <div class="dashboard-shell">
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="tag">Local Home Dashboard</p>
          <h1>Bom dia!</h1>
          <p class="subtitle">Painel Shelly em tempo real para toda a casa.</p>
        </div>
        <div class="hero-widgets">
          <div class="widget weather">
            <span class="weather-temp">22&deg;</span>
            <span class="weather-label">Poucas nuvens</span>
          </div>
          <div class="widget clock" id="clock-widget">--:--</div>
        </div>
      </header>

      <main class="layout">
        <section class="panel" aria-labelledby="devices-title">
          <div class="panel-head">
            <h2 id="devices-title">Dispositivos</h2>
          </div>

          <div class="device-list" id="device-list">
            {% for device in devices %}
            <button class="device-card is-off {% if device.image %}has-bg-image{% endif %}" data-device-id="{{ device.id }}" data-room="{{ device.room }}" data-component="{{ device.component or 'relay' }}" type="button" data-action="toggle" title="Toggle {{ device.name }}" {% if device.image %}style="--card-bg-image: url('{{ device.image }}');"{% endif %}>
              {% if not device.image %}
              <div class="device-image fallback-icon" aria-hidden="true">{% if (device.component or 'relay') == 'cover' %}🪟{% elif (device.component or 'relay') == 'light' %}🔆{% else %}💡{% endif %}</div>
              {% endif %}
              <div class="device-meta">
                <h3>{{ device.name }}</h3>
                <p class="host">{{ device.host }}</p>
                {% if device.other_names %}
                <p class="aliases">{{ device.other_names|join(' / ') }}</p>
                {% endif %}
                <p class="state" data-state>Checking...</p>
                {% if (device.component or 'relay') == 'cover' %}
                <div class="cover-controls" aria-label="Roller controls">
                  <span class="cover-cmd" data-cover-cmd="open" role="button" tabindex="0">↑</span>
                  <span class="cover-cmd" data-cover-cmd="close" role="button" tabindex="0">↓</span>
                  <span class="cover-cmd" data-cover-cmd="stop" role="button" tabindex="0">■</span>
                </div>
                {% endif %}
                {% if (device.component or 'relay') == 'light' %}
                <div class="cover-controls" aria-label="Dimmer controls">
                  <span class="cover-cmd" data-light-set="1" role="button" tabindex="0">%</span>
                </div>
                {% endif %}
              </div>
            </button>
            {% endfor %}
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="cover-modal" id="cover-modal" hidden>
    <div class="cover-modal-card" role="dialog" aria-modal="true" aria-labelledby="cover-modal-title">
      <h3 id="cover-modal-title">Posição do estore</h3>
      <p class="cover-modal-value" id="cover-modal-value">0%</p>
      <input id="cover-modal-slider" class="cover-modal-slider" type="range" min="0" max="100" step="1" value="0">
      <div class="cover-modal-presets" id="cover-modal-presets">
        <span class="cover-cmd" data-cover-preset="0" role="button" tabindex="0">0%</span>
        <span class="cover-cmd" data-cover-preset="25" role="button" tabindex="0">25%</span>
        <span class="cover-cmd" data-cover-preset="50" role="button" tabindex="0">50%</span>
        <span class="cover-cmd" data-cover-preset="75" role="button" tabindex="0">75%</span>
        <span class="cover-cmd" data-cover-preset="100" role="button" tabindex="0">100%</span>
      </div>
      <div class="cover-modal-actions">
        <button type="button" class="cover-modal-btn" id="cover-modal-cancel">Cancelar</button>
        <button type="button" class="cover-modal-btn is-primary" id="cover-modal-save">Aplicar</button>
      </div>
    </div>
  </div>

  <div class="cover-modal" id="light-modal" hidden>
    <div class="cover-modal-card" role="dialog" aria-modal="true" aria-labelledby="light-modal-title">
      <h3 id="light-modal-title">Intensidade da luz</h3>
      <p class="cover-modal-value" id="light-modal-value">0%</p>
      <input id="light-modal-slider" class="cover-modal-slider" type="range" min="0" max="100" step="1" value="0">
      <div class="cover-controls" aria-label="Ajuste fino dimmer">
        <span class="cover-cmd" data-light-modal-step="down" role="button" tabindex="0">-5%</span>
        <span class="cover-cmd" data-light-modal-step="up" role="button" tabindex="0">+5%</span>
      </div>
      <div class="cover-modal-presets" id="light-modal-presets">
        <span class="cover-cmd" data-light-preset="0" role="button" tabindex="0">0%</span>
        <span class="cover-cmd" data-light-preset="25" role="button" tabindex="0">25%</span>
        <span class="cover-cmd" data-light-preset="50" role="button" tabindex="0">50%</span>
        <span class="cover-cmd" data-light-preset="75" role="button" tabindex="0">75%</span>
        <span class="cover-cmd" data-light-preset="100" role="button" tabindex="0">100%</span>
      </div>
      <div class="cover-modal-actions">
        <button type="button" class="cover-modal-btn" id="light-modal-cancel">Cancelar</button>
        <button type="button" class="cover-modal-btn is-primary" id="light-modal-save">Aplicar</button>
      </div>
    </div>
  </div>

  <script>
    window.__CONFIGURED_DEVICES__ = {{ devices|tojson }};
  </script>
  <script src="{{ url_for('static', filename='app.js', v='16') }}"></script>
</body>
</html>
