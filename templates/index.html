<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Home Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="dashboard-shell">
    <aside class="side-nav" aria-label="Primary">
      <button class="nav-btn is-active" type="button">Casa</button>
      <button class="nav-btn" type="button">Luzes</button>
      <button class="nav-btn" type="button">Cenas</button>
      <button class="nav-btn" type="button">Estado</button>
    </aside>

    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="tag">Local Home Dashboard</p>
          <h1>Bom dia!</h1>
          <p class="subtitle">Painel Shelly em tempo real para toda a casa.</p>
        </div>
        <div class="hero-widgets">
          <div class="widget weather">
            <span class="weather-temp">22&deg;</span>
            <span class="weather-label">Poucas nuvens</span>
          </div>
          <div class="widget clock" id="clock-widget">--:--</div>
        </div>
      </header>

      <main class="layout">
        <section class="panel" aria-labelledby="devices-title">
          <div class="panel-head">
            <h2 id="devices-title">Dispositivos</h2>
            <button id="refresh-all" class="ghost" type="button">Atualizar</button>
          </div>

          <div class="device-list" id="device-list"></div>
        </section>

        <section class="panel muted">
          <h2>Ações rápidas</h2>
          <div class="quick-actions">
            <button class="switch" data-scene="off" type="button">Desligar tudo</button>
            <button class="switch" data-scene="on" type="button">Ligar tudo</button>
          </div>
          <p class="note">As ações rápidas aplicam a todos os dispositivos visíveis no painel.</p>
        </section>
      </main>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
